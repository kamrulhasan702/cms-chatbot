services:
  chatbot:
    build: .
    ports:
      - "8080:8080"
    environment:
      Ai__ApiKey: ${AI_API_KEY:?Set AI_API_KEY in .env}
      Ai__BaseUrl: ${AI_BASE_URL:-https://api.openai.com/v1/}
      Ai__VisionModel: ${AI_VISION_MODEL:-}
      Ai__Model: ${AI_MODEL:-gpt-4.1-mini}
    restart: unless-stopped
